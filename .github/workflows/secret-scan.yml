# Scans only what a push or pull request adds for credential-shaped text
# (.github/scripts/scan-secrets.py). This repository is public: a key committed
# here is readable by everyone, in the diff and in history, even after the
# line is deleted. Existing history and files are not scanned, so this cannot
# fail on something merged earlier. No external action, no secrets.

name: Secret scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan the added lines
        # A pull request checks out its merge commit, so its changes are the
        # diff from the base. A push is the diff from the commit master was at;
        # without one (new branch, rewritten history) only the head commit is read.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE=$PR_BASE
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            BASE=$PUSH_BEFORE
          else
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          export BASE
          python3 .github/scripts/scan-secrets.py
