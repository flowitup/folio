# Deploy backend (api image) to prod VM.
#
# Triggered by:
#   - repository_dispatch (event_type: deploy-api) from folio-back-end's
#     release job after it tags a new version.
#   - workflow_dispatch with explicit version + sha (manual fallback).
#
# Flow: checkout submodule@<sha> → buildx → push api image to AR
#   (tags <sha> + latest) → SSH to the Hetzner prod host with the CI key,
#   whose only allowed request is `deploy api <sha> <host-files sha256>` (forced
#   command /opt/folio/scripts/ci-deploy.sh, short-lived WIF token on stdin)
#   → owner-installed deploy-runner.sh <sha> api → smoke /health → (separate
#   job) commit submodule pointer bump on master.
#
# Host: Hetzner CX33 `folio-prod-1` (46.224.167.14) since the 2026-07-15
# GCP→Hetzner migration. AR stays on GCP (image registry only).
#
# Permission model: the build job runs untrusted submodule source (post-install
# hooks, malicious Python wheels) inside docker buildx. It must NOT hold a
# token that can write to parent master. The build job's GITHUB_TOKEN is
# `contents: read` only. A separate bump-pointer job, gated by `needs: build`,
# holds `contents: write` and runs only after build+smoke succeed — its only
# step is the gitlink commit, so there's no untrusted code path that touches
# the write-scoped token.
#
# Plan: plans/260503-0913-parent-auto-deploy-on-version-bump/phase-01-...md
# Runbook: docs/deployment-guide.md §3.1, §4.1

name: Deploy Backend

on:
  repository_dispatch:
    types: [deploy-api]
  workflow_dispatch:
    inputs:
      version:
        description: "Backend version (e.g. 1.2.3)"
        required: true
        type: string
      sha:
        description: "folio-back-end commit SHA (7-40 hex)"
        required: true
        type: string

concurrency:
  group: deploy-prod-backend
  cancel-in-progress: false

env:
  PROJECT_ID: flowitup-folio-prod
  REGION: europe-west1
  AR_REPO: folio
  IMAGE_NAME: api
  PROD_HOST: 46.224.167.14   # Hetzner folio-prod-1
  PROD_SSH_USER: root
  PROD_DOMAIN: folio.flowitup.com
  SUBMODULE_REPO: flowitup/folio-back-end
  SUBMODULE_PATH: folio-back-end

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Default-narrow: read-only on parent contents. The build step pulls
    # submodule source at an attacker-controlled SHA and runs it through
    # docker buildx; a build-time exfil of GITHUB_TOKEN therefore cannot
    # push to parent master. `id-token: write` is required by WIF (the OIDC
    # token is bound to this workflow run, not to repo contents).
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.input.outputs.sha }}
      version: ${{ steps.input.outputs.version }}
    steps:
      - name: Resolve inputs (dispatch vs manual)
        id: input
        # The dispatch payload and the manual inputs are chosen by the caller,
        # so they reach this script only as environment variables, never pasted
        # into its text, and nothing uses them before they pass the checks. A
        # rejected value is printed shell-escaped on one line, so it can't
        # start a workflow command of its own.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            VERSION=$PAYLOAD_VERSION
            SHA=$PAYLOAD_SHA
          else
            VERSION=$INPUT_VERSION
            SHA=$INPUT_SHA
          fi
          [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { printf '::error::invalid sha %q\n' "$SHA"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf '::error::invalid version %q\n' "$VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::deploying api v$VERSION (sha $SHA)"

      - name: Checkout parent (for deploy scripts + compose files)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Build job is contents:read — no need to persist credentials in
          # the worktree (eliminates one exfil vector).
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout folio-back-end at SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ env.SUBMODULE_REPO }}
          ref: ${{ steps.input.outputs.sha }}
          path: src-be
          persist-credentials: false
          # SUBMODULE_TOKEN is REQUIRED when the sibling repo is private —
          # GITHUB_TOKEN cannot read other private repos in the org.
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
          # Fetch tags so the version<->sha verify step can check tag points-at.
          fetch-tags: true

      - name: Verify version↔sha tag
        # Resolve the tag via the GitHub REST API and ensure the version in
        # the payload actually points at the SHA being deployed. Runs on
        # BOTH triggers: a leaked `repository_dispatch` token could otherwise
        # invoke a deploy with an attacker-chosen SHA from any internal
        # branch (the SHA-regex allows any 7-40 hex string, including ones
        # that never made it to a signed release tag).
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.input.outputs.version }}
          SHA: ${{ steps.input.outputs.sha }}
        run: |
          set -e
          tag_sha=$(gh api "repos/${{ env.SUBMODULE_REPO }}/commits/v${VERSION}" --jq .sha 2>/dev/null || true)
          if [ -z "$tag_sha" ]; then
            echo "::error::tag v${VERSION} does not exist on ${{ env.SUBMODULE_REPO }}"
            exit 1
          fi
          if [ "$tag_sha" = "$SHA" ] || [[ "$SHA" == "$tag_sha"* ]] || [[ "$tag_sha" == "$SHA"* ]]; then
            echo "::notice::tag v${VERSION} points at ${SHA} ✓ (resolved $tag_sha)"
          else
            echo "::error::tag v${VERSION} points at ${tag_sha} but caller passed ${SHA}"
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          # Workload Identity Federation — keyless auth via GitHub OIDC token.
          # Org policy `iam.disableServiceAccountKeyCreation` blocks JSON keys.
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build + push api image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ./src-be
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.input.outputs.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.input.outputs.sha }}
            org.opencontainers.image.version=${{ steps.input.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ env.SUBMODULE_REPO }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Setup SSH to prod host (Hetzner)
        # Dedicated CI keypair (folio-ci-deploy). On the host it is restricted to
        # one forced command, /opt/folio/scripts/ci-deploy.sh (see the next two
        # steps). Host key pinned — a MITM or rebuilt server fails closed
        # instead of prompting.
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_ed25519
          chmod 600 ~/.ssh/prod_ed25519
          echo "${PROD_HOST} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL3VjxZ2FCtovWWzZFNQvtNd4STB6qO8KSkEI62tkWOO" > ~/.ssh/known_hosts
          echo "SSH_OPTS=-i $HOME/.ssh/prod_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20" >> "$GITHUB_ENV"

      - name: Check the CI key is restricted on the host
        # A shell request with this key must be refused by the forced command.
        # If the host answers it any other way — the key lost its restriction,
        # or the secret holds some other key — stop before the registry token
        # or any request is sent.
        run: |
          rc=0
          out=$(ssh -T $SSH_OPTS "${PROD_SSH_USER}@${PROD_HOST}" </dev/null 2>&1) || rc=$?
          if [ "$rc" -eq 2 ] && printf '%s\n' "$out" | grep -qx 'rejected: unexpected command'; then
            echo "::notice::the host refused a shell request with the CI key: forced command in place"
          else
            echo "::error::a shell request with the CI key must be refused (exit 2, 'rejected: unexpected command'); got exit ${rc}"
            exit 1
          fi

      - name: Deploy on VM (ci-deploy.sh → deploy-runner.sh)
        # One request, `deploy api <sha> <host-files sha256>`, with a short-lived
        # WIF access token on stdin — no service-account keys on the VM (org
        # policy blocks key creation), token expires in ~1h. ci-deploy.sh logs
        # Docker in with a throwaway config, runs the owner-installed
        # deploy-runner.sh (pull image → flask db upgrade → swap api with
        # --no-deps → wait-healthy), then deletes the config.
        #
        # The deploy scripts and compose files are installed on the host by the
        # owner, never by CI (scripts/README.md, "Installing the host files").
        # The sha256 covers them, in ci-deploy.sh's order: the host refuses to
        # deploy while its copies differ from this checkout.
        #
        # SHA was validated as 7-40 lowercase hex above; the host checks the
        # whole request against its own strict grammar again. The token is
        # minted before connecting, so a gcloud failure fails this step
        # directly instead of reaching the host as a missing token.
        env:
          SHA: ${{ steps.input.outputs.sha }}
        run: |
          set -e
          host_files_sha256=$(cat scripts/deploy/ci-deploy.sh scripts/deploy/deploy-runner.sh scripts/deploy/wait-healthy.sh scripts/deploy/rollback.sh docker-compose.yml docker-compose.prod.yml | sha256sum | cut -d' ' -f1)
          token=$(gcloud auth print-access-token)
          printf '%s\n' "$token" | ssh $SSH_OPTS "${PROD_SSH_USER}@${PROD_HOST}" "deploy api ${SHA} ${host_files_sha256}"

      - name: Smoke /health (assert 200 + JSON shape)
        # Cache-bust via ?_=<epoch> to defeat any accidental CF page rule.
        # JSON-shape check defends against CF custom error pages that 200 with HTML.
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -fsS -o /tmp/healthz.json -w '%{http_code}' --max-time 10 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://${{ env.PROD_DOMAIN }}/health?_=$(date +%s)" || echo "000")
            if [ "$code" = "200" ] && \
               jq -e '(.status == "ok") or (.ok == true) or (.healthy == true)' /tmp/healthz.json >/dev/null 2>&1; then
              echo "::notice::smoke ok (200, JSON ok) — $(cat /tmp/healthz.json)"
              exit 0
            fi
            echo "smoke try $i/5: code=$code body=$(head -c 200 /tmp/healthz.json 2>/dev/null || echo none)"
            sleep 5
          done
          echo "::error::smoke failed — /health did not return 200 with healthy JSON after 5 tries"
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          VERSION: ${{ steps.input.outputs.version }}
          SHA: ${{ steps.input.outputs.sha }}
        run: |
          echo "::error::API deploy failed for v${VERSION} (${SHA})"
          echo "::error::Runbook: https://github.com/${{ github.repository }}/blob/master/docs/deployment-guide.md#41-site-down--first-5-minutes"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.input.outputs.version }}
          SHA: ${{ steps.input.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Deploy Backend — build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | v${VERSION} |"
            echo "| SHA | \`${SHA}\` |"
            echo "| Trigger | ${EVENT_NAME} |"
            echo "| Image | \`${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  bump-pointer:
    # Runs ONLY after build+smoke succeed. Its sole task is to write the
    # submodule pointer commit back to parent master — so the `contents:write`
    # token is held by a job that contains no untrusted-code path. The build
    # job's potentially-malicious docker-build step has already completed and
    # released its (read-only) token before this job starts.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout parent (with write credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Bump folio-back-end pointer in parent master
        # Writes the gitlink directly via update-index (no second clone needed,
        # so no cross-repo auth dance for the submodule remote). On race with
        # a human master push, retry fetch+rebase+push up to 3x with backoff.
        env:
          SHA: ${{ needs.build.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git update-index --add --cacheinfo "160000,${SHA},${SUBMODULE_PATH}"
          if git diff --cached --quiet; then
            echo "submodule pointer already at ${SHA} — nothing to commit"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            commit_msg="chore(deploy): folio-back-end → ${SHA} [manual] [skip ci]"
          else
            commit_msg="chore(deploy): folio-back-end → ${SHA} (v${VERSION}) [skip ci]"
          fi
          git commit -m "$commit_msg"
          for i in 1 2 3; do
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort
              echo "::error::pointer-bump rebase failed onto origin/master"
              exit 1
            fi
            if git push origin HEAD:master; then
              echo "::notice::pointer commit pushed (try $i/3)"
              exit 0
            fi
            echo "push race on master, retrying ($i/3)"
            sleep $((i * 5))
          done
          echo "::error::failed to push pointer commit after 3 retries — deploy is live, parent master is stale"
          exit 1
