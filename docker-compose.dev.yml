# Development override — applied on top of docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Why this file exists:
#   The base docker-compose.yml requires every secret-bearing var via
#   `${VAR:?required}` so production cannot accidentally boot with known
#   credentials. Local development still needs sensible defaults to run
#   `docker compose up` without a hand-crafted .env. Those dev-only defaults
#   live here.
#
# Never use these values in production. The prod overlay
# (docker-compose.prod.yml) supplies real values from /opt/folio/.env which is
# rendered from Secret Manager.

services:
  api:
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-construction}:${POSTGRES_PASSWORD:-construction}@db:5432/${POSTGRES_DB:-construction}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-construction-attachments}
      - S3_REGION=${S3_REGION:-us-east-1}
      # Sign-in is phone + SMS code only, and the code is written to the API log
      # (SMS_PROVIDER defaults to "log"). These two let the Playwright suite and
      # manual QA finish a sign-in without reading a log line: the backend accepts
      # OTP_TEST_CODE in place of the real code, but only when FLASK_ENV is an
      # explicit non-production value — an unset FLASK_ENV counts as production and
      # refuses the bypass. Both are absent from docker-compose.prod.yml.
      - FLASK_ENV=${FLASK_ENV:-development}
      - OTP_TEST_CODE=${OTP_TEST_CODE:-424242}
      # Assistant AI feature: on by default locally so the conversation is
      # visible without extra setup, and SCAN_MODE defaults to the free local
      # opencv path instead of the paid GenAI one. The API keys themselves
      # are NOT defaulted here — they stay empty until a developer exports
      # them, so GET /features still reports assistant:false (D3) until then.
      - FEATURE_ASSISTANT=${FEATURE_ASSISTANT:-1}
      - SCAN_MODE=${SCAN_MODE:-opencv}

  worker:
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-construction}:${POSTGRES_PASSWORD:-construction}@db:5432/${POSTGRES_DB:-construction}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      # See `api` above — same dev defaults, keys still empty.
      - FEATURE_ASSISTANT=${FEATURE_ASSISTANT:-1}
      - SCAN_MODE=${SCAN_MODE:-opencv}

  ai-browser:
    environment:
      # See `api` above — same dev defaults, keys still empty.
      - FEATURE_ASSISTANT=${FEATURE_ASSISTANT:-1}
      - SCAN_MODE=${SCAN_MODE:-opencv}

  db:
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-construction}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-construction}
      - POSTGRES_DB=${POSTGRES_DB:-construction}

  minio:
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}

  frontend:
    build:
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000/api/v1}
    environment:
      - API_INTERNAL_BASE_URL=${API_INTERNAL_BASE_URL:-http://api:5000/api/v1}
