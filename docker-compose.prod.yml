# Production override — applied on top of docker-compose.yml.
#
# Do not run directly; use scripts/deploy/deploy-runner.sh or
# scripts/deploy/rollback.sh. They pin IMAGE_TAG per service, pass
# --env-file /opt/folio/.env and run migrations first. A bare
# `docker compose ... up -d` pulls :latest and skips migrations (README.md).
#
# What this changes:
#  1. All published ports bound to 127.0.0.1 only (cloudflared reaches them via
#     loopback). No 0.0.0.0 exposure even if the firewall slips. Red-team #10.
#  2. db/redis ports REMOVED — only Docker network access from api.
#  3. Credential env vars use ${VAR:?required} → compose ABORTS if any is unset.
#     Defeats the dev-friendly :-default fallbacks that would otherwise leak
#     to prod. Red-team #4.
#  4. FLASK_DEBUG forced to false.
#
# Compose merge tags used:
#   !reset []     — clears the inherited list (db/redis ports)
#   !override     — replaces the inherited list (other services' ports)
# Both require Docker Compose v2.20+.

services:
  api:
    # Pull from Artifact Registry; CI pins ${IMAGE_TAG} per-deploy (SHA), falls
    # back to :latest for ad-hoc `docker compose pull`. Base compose's `build:`
    # is ignored when `image:` resolves locally — dev still works unchanged.
    image: europe-west1-docker.pkg.dev/flowitup-folio-prod/folio/api:${IMAGE_TAG:-latest}
    pull_policy: always
    ports: !override
      - "127.0.0.1:5000:5000"
    environment:
      - "DATABASE_URL=postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:?required}"
      - "SECRET_KEY=${SECRET_KEY:?required}"
      - "JWT_SECRET_KEY=${JWT_SECRET_KEY:?required}"
      - "REDIS_URL=redis://redis:6379/0"
      - "CORS_ORIGINS=${CORS_ORIGINS:?required}"
      - "EMAIL_PROVIDER=${EMAIL_PROVIDER:?required}"
      - "RESEND_API_KEY=${RESEND_API_KEY:?required}"
      - "RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:?required}"
      # Back-end's wiring.py reads FROM_EMAIL (not RESEND_FROM_EMAIL).
      # Aliased here until the env-var name is unified across phases.
      - "FROM_EMAIL=${RESEND_FROM_EMAIL:?required}"
      # FLASK_ENV=production triggers (config/__init__.py):
      #   - JWT_COOKIE_SECURE=True   (browsers require for SameSite=None)
      #   - JWT_COOKIE_CSRF_PROTECT=True (front-end handles via csrf_access_token)
      #   - JWT_COOKIE_SAMESITE=Strict
      # Plus app/__init__.py fail-fast asserts no "dev-" in JWT/SECRET keys.
      - "FLASK_ENV=production"
      - "FLASK_DEBUG=false"
      # Phone number + SMS code is the only sign-in there is: the e-mail and
      # password route was deleted from the API (flowitup/folio-back-end#174),
      # and with it the LOGIN_MODE switch that used to select between them. An
      # account without a phone number cannot sign in at all. Refresh tokens
      # keep the default 7-day policy.
      #
      # cloudflared is the single proxy in front of this container, so the API
      # reads the caller's address from the X-Forwarded-For it sets. Without
      # this the socket peer — cloudflared itself — is the address every rate
      # limit counts against, and the "5 per minute" on the sign-in code routes
      # becomes one bucket shared by everybody.
      - "TRUSTED_PROXY_HOPS=1"
      # Sign-in codes leave from the owner's Android phone through the
      # "SMS Gateway for Android" app (app/infrastructure/adapters/sms_gateway_sender.py).
      # SMS_GATEWAY_URL is the full message endpoint the prod host can reach:
      # the phone's local server (http://<ip>:8080/message) or the cloud relay
      # (https://api.sms-gate.app/3rdparty/v1/messages); credentials are shown in the app.
      # Secret Manager: folio-sms-gateway-{url,username,password}.
      # Mobile push notifications go out through Expo. Without PUSH_PROVIDER the API
      # defaults to "log": every push is written to the log and nobody receives it.
      # EXPO_ACCESS_TOKEN is only needed if the Expo project enforces push security.
      - "PUSH_PROVIDER=${PUSH_PROVIDER:-expo}"
      - "EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN:-}"
      - "SMS_PROVIDER=gateway"
      - "SMS_GATEWAY_URL=${SMS_GATEWAY_URL:?required}"
      - "SMS_GATEWAY_USERNAME=${SMS_GATEWAY_USERNAME:?required}"
      - "SMS_GATEWAY_PASSWORD=${SMS_GATEWAY_PASSWORD:?required}"
      # Store-review account (App Store / Play review). ONE French number whose
      # sign-in code is fixed, so a reviewer with no access to the SIM can still
      # get past the phone-only login: /otp/request stores a code but sends no
      # SMS and skips the throttle, /otp/verify accepts OTP_REVIEWER_CODE — for
      # that number only. Every other phone still needs its real SMS code, and
      # the fixed code is rejected for them (app/application/usecases/otp_login.py
      # _reviewer_code_for). Set BOTH or NEITHER: the API refuses to boot on half a
      # configuration or a code that is not 6 digits (validate_boot_settings).
      # Empty defaults on purpose, so clearing the secrets after a review cannot
      # break a deploy.
      # Secret Manager: folio-otp-reviewer-{phone,code}.
      - "OTP_REVIEWER_PHONE=${OTP_REVIEWER_PHONE:-}"
      - "OTP_REVIEWER_CODE=${OTP_REVIEWER_CODE:-}"
      # Optional tuning. Each default below is the API's own default
      # (folio-back-end config/__init__.py), so an unset key changes nothing and
      # the order of compose and image deploys does not matter. The API refuses
      # to boot on a malformed value.
      # Minimum app version (x.y.z) per platform; when one is set, its
      # APP_UPDATE_URL_* must be the https store listing. Empty = no forced update.
      - "APP_MIN_VERSION_IOS=${APP_MIN_VERSION_IOS:-}"
      - "APP_MIN_VERSION_ANDROID=${APP_MIN_VERSION_ANDROID:-}"
      - "APP_UPDATE_URL_IOS=${APP_UPDATE_URL_IOS:-}"
      - "APP_UPDATE_URL_ANDROID=${APP_UPDATE_URL_ANDROID:-}"
      - "PUSH_LOCALE=${PUSH_LOCALE:-vi}"
      - "REFRESH_TOKEN_POLICY=${REFRESH_TOKEN_POLICY:-expiring}"
      - "OTP_TTL_SECONDS=${OTP_TTL_SECONDS:-300}"
      - "OTP_RESEND_SECONDS=${OTP_RESEND_SECONDS:-60}"
      - "OTP_HOURLY_MAX=${OTP_HOURLY_MAX:-5}"
      - "OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:-5}"
      - "SMS_GLOBAL_MAX_PER_10MIN=${SMS_GLOBAL_MAX_PER_10MIN:-60}"
      - "SMS_GLOBAL_MAX_PER_DAY=${SMS_GLOBAL_MAX_PER_DAY:-400}"
      - "SMS_OPEN_MAX_PER_10MIN=${SMS_OPEN_MAX_PER_10MIN:-30}"
      - "SMS_OPEN_MAX_PER_DAY=${SMS_OPEN_MAX_PER_DAY:-150}"
      - "SMS_SEND_IP_LIMITS=${SMS_SEND_IP_LIMITS:-20 per hour;60 per day}"
      # Team chat (app/api/v1/chat, config/__init__.py FEATURE_CHAT — default off).
      # Gates every chat route and the `chat` flag returned by GET /api/v1/features,
      # which the web widget and the mobile chat tab read before showing themselves.
      - "FEATURE_CHAT=1"
      # Base URL used to build accept-invite links inside invitation emails
      # (app/application/invitations/create_invitation_usecase.py). Without this,
      # wiring.py falls back to http://localhost:3000.
      - "APP_BASE_URL=https://folio.flowitup.com"
      - "S3_ENDPOINT_URL=${S3_ENDPOINT_URL:?required}"
      - "S3_ACCESS_KEY=${S3_ACCESS_KEY:?required}"
      - "S3_SECRET_KEY=${S3_SECRET_KEY:?required}"
      - "S3_BUCKET=${S3_BUCKET:?required}"
      - "S3_REGION=${S3_REGION:?required}"
      # Should be set (e.g. https://s3.folio.flowitup.com): the API signs
      # preview/upload URLs for this origin, and the web app's CSP only allows
      # https://s3.<PROD_DOMAIN> (NEXT_PUBLIC_S3_PUBLIC_URL, baked in at build
      # time by deploy-frontend.yml) — keep the two equal. Optional so a missing
      # value never blocks a deploy: the API logs a warning at startup and
      # falls back to its previous behaviour.
      - "S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-}"

  db:
    ports: !reset []
    environment:
      - "POSTGRES_USER=${POSTGRES_USER:?required}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}"
      - "POSTGRES_DB=${POSTGRES_DB:?required}"

  redis:
    ports: !reset []

  minio:
    ports: !override
      - "127.0.0.1:9000:9000"   # S3 API — reached by cloudflared / SSH-tunnel only
      - "127.0.0.1:9001:9001"   # console — admin via SSH port-forward only
    environment:
      - "MINIO_ROOT_USER=${S3_ACCESS_KEY:?required}"
      - "MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:?required}"
      - "MINIO_SERVER_URL=${S3_PUBLIC_ENDPOINT_URL:-}"

  frontend:
    image: europe-west1-docker.pkg.dev/flowitup-folio-prod/folio/frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      - "NODE_ENV=production"
      - "API_INTERNAL_BASE_URL=${API_INTERNAL_BASE_URL:?required}"
      # No NEXT_PUBLIC_S3_PUBLIC_URL here: it is inlined at build time
      # (deploy-frontend.yml), so a runtime value would be ignored. The build
      # takes the repository variable S3_PUBLIC_ENDPOINT_URL, else
      # https://s3.<PROD_DOMAIN>; keep it equal to S3_PUBLIC_ENDPOINT_URL in
      # /opt/folio/.env, which the API and MinIO use.
